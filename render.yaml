# Despliegue del backend en Render (plan free, Docker).
# Uso: Render → New → Blueprint → seleccionar este repo.
# Las variables marcadas con sync: false se piden en el panel y NUNCA van al repo.
services:
  - type: web
    name: productivity-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://jfmydwshyvpplsxkrwns.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      # Origen del panel web y redirect de Google: dependen del dominio real,
      # por eso se piden en el panel y no se fijan en el repo.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
