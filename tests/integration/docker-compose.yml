
services:
  # PostgreSQL para tests de integración (compatibilidad con schema Supabase)
  postgres:
    image: postgres:16-alpine
    container_name: productivity-test-postgres
    environment:
      POSTGRES_DB: productivity_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fixtures/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d productivity_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis para rate limiting, cache, sesiones
  redis:
    image: redis:7-alpine
    container_name: productivity-test-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Supabase local (opcional - para tests que requieran auth real de Supabase)
  # Descomentar si se necesita auth completo de Supabase
  # supabase:
  #   image: supabase/postgres:15.1.0.117
  #   container_name: productivity-test-supabase
  #   environment:
  #     POSTGRES_DB: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - supabase_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data:
  # supabase_data: