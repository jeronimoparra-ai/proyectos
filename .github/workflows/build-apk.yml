name: Build APK

# Build APK — Android release (hardened, T6b)
#
# Genera un APK instalable sin depender de EAS y lo publica como asset de una
# Release, para tener un enlace de descarga permanente que no caduque.
#
# Enlace resultante:
#   https://github.com/jeronimoparra-ai/proyectos/releases/latest/download/productivity-app.apk
#
# ── Endurecimiento T6b ──────────────────────────────────────────────────────
# Toda publicación futura exige pasar un gate de validación (job: validate)
# antes de que el job de compilación arranque. El gate ejecuta:
#   - typecheck del backend (tsc --noEmit)
#   - typecheck de la app (tsc --noEmit)
#   - lint del backend con regresión guard (no sube por encima del baseline)
#   - expo-doctor (documentado: expo 57.0.32 vs ~57.0.33 — no bloqueante)
#   - build del backend (tsc → dist/)
# Si cualquiera falla, el APK no se compila ni se publica.
#
# ── Secretos necesarios ─────────────────────────────────────────────────────
# Si no existen los secrets de Supabase/API, el APK se compila igual y al
# abrirlo muestra la pantalla "Configuración incompleta" en lugar de cerrarse.
# Definir en Settings → Secrets and variables → Actions:
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#   EXPO_PUBLIC_API_URL

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'
  # Se inlinean en el bundle al compilar. Vacíos → la app avisa en vez de romper.
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate: Validación completa antes de compilar
  # El job `apk` solo arranca si este gate es verde.
  # ─────────────────────────────────────────────────────────────────────────
  validate:
    name: Pre-build validation gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Backend — typecheck
        run: npx tsc --noEmit
        working-directory: backend

      - name: Backend — unit tests
        run: npx vitest run
        working-directory: backend

      # Lint: falla si el número TOTAL de problemas sube por encima del
      # baseline registrado en T6b (191 errors + 5 warnings = 196 total).
      - name: Backend — lint regresion guard
        working-directory: backend
        run: |
          BASELINE_TOTAL=196
          LINT_OUTPUT=$(npx eslint src --format json 2>/dev/null || true)
          CURRENT_ERRORS=$(echo "$LINT_OUTPUT" | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(d.reduce((s,f)=>s+f.errorCount,0));
          ")
          CURRENT_WARNS=$(echo "$LINT_OUTPUT" | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(d.reduce((s,f)=>s+f.warningCount,0));
          ")
          CURRENT_TOTAL=$((CURRENT_ERRORS + CURRENT_WARNS))
          echo "Baseline: ${BASELINE_TOTAL} | Current: ${CURRENT_TOTAL}"
          if [ "$CURRENT_TOTAL" -gt "$BASELINE_TOTAL" ]; then
            echo "❌ Lint regression: ${CURRENT_TOTAL} > ${BASELINE_TOTAL}"
            exit 1
          fi
          echo "✅ Lint within baseline"

      - name: Backend — build
        run: npm run build
        working-directory: backend

      # ── App ──────────────────────────────────────────────────────────────
      - name: Install app dependencies
        run: npm ci --legacy-peer-deps
        working-directory: app

      # expo-doctor: 57.0.32 vs ~57.0.33 es deuda preexistente documentada.
      # Se mantiene como informativo; NO bloquea el build.
      - name: App — expo-doctor (informativo; warn preexistente documentado)
        run: npx expo-doctor
        working-directory: app
        continue-on-error: true

      - name: App — typecheck
        run: npx tsc --noEmit
        working-directory: app

  # ─────────────────────────────────────────────────────────────────────────
  # APK: Solo arranca si validate es verde
  # ─────────────────────────────────────────────────────────────────────────
  apk:
    # Solo el job que publica el APK necesita escribir en Releases.
    permissions:
      contents: write
    name: Android APK
    runs-on: ubuntu-24.04
    needs: [validate]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      # Segunda pasada de expo-doctor antes de compilar (gate explícito).
      # Si aparece un nuevo fallo (distinto del 57.0.32 documentado), sí bloquea.
      - name: Expo Doctor (pre-build check)
        run: npx expo-doctor
        continue-on-error: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Firma opcional pero recomendada: si existen los secrets, la APK queda firmada
      # y Android la instala sin problema. Si no existen, emite aviso y genera APK
      # sin firmar (debug-similar) solo apto para validación, NO para distribución.
      - name: Sign release APK (saltado si faltan secrets)
        working-directory: app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          # Un APK sin firmar en la Release "oficial" es un problema de cadena de
          # suministro: se aborta el build en vez de publicar algo que Android
          # rechazará al instalar.
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] || [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Faltan RELEASE_KEYSTORE_BASE64 o RELEASE_KEYSTORE_PASSWORD: no se publica un APK sin firmar."
            exit 1
          fi
          cd android
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          # gradle.properties generado por prebuild no acaba en salto de linea:
          # sin el \n inicial, la ultima propiedad queda concatenada y el
          # autolinking de Expo recibe JSON corrupto (node exit 1).
          printf '\nRELEASE_STORE_FILE=release.keystore\nRELEASE_KEY_ALIAS=proyectos\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_PASSWORD=%s\n' \
            "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEYSTORE_PASSWORD" >> gradle.properties
          python3 - <<'PY'
          path = 'app/build.gradle'
          s = open(path).read()
          old_signing = '    signingConfigs {\n        debug {\n            storeFile file(\'debug.keystore\')\n            storePassword \'android\'\n            keyAlias \'androiddebugkey\'\n            keyPassword \'android\'\n        }\n    }'
          new_signing = '    signingConfigs {\n        debug {\n            storeFile file(\'debug.keystore\')\n            storePassword \'android\'\n            keyAlias \'androiddebugkey\'\n            keyPassword \'android\'\n        }\n        release {\n            storeFile file(findProperty(\'RELEASE_STORE_FILE\') ?: \'release.keystore\')\n            storePassword findProperty(\'RELEASE_STORE_PASSWORD\')\n            keyAlias findProperty(\'RELEASE_KEY_ALIAS\') ?: \'proyectos\'\n            keyPassword findProperty(\'RELEASE_KEY_PASSWORD\')\n        }\n    }'
          if 'findProperty(\'RELEASE_STORE_FILE\')' in s:
              print('signing release ya cableado — skip')
              exit(0)
          assert s.count(old_signing) == 1, 'signingConfigs block inesperado'
          s = s.replace(old_signing, new_signing, 1)

          # OJO: el template de Expo 57 tiene `signingConfig signingConfigs.debug`
          # en buildTypes.debug Y en buildTypes.release. Reemplazar la primera
          # ocurrencia dejaba release firmado con la clave DEBUG de AOSP (publica).
          # Se localiza el bloque buildTypes y se cambia SOLO dentro de release.
          import re
          m = re.search(r'(    buildTypes \{)(.*?)(\n    \})', s, re.S)
          assert m, 'buildTypes block inesperado'
          block = m.group(2)
          assert block.count('        release {') == 1, 'release buildType inesperado'
          rel_at = block.index('        release {')
          rel_block = block[rel_at:]
          assert 'signingConfig signingConfigs.debug' in rel_block, 'firma release inesperada'
          new_block = block[:rel_at] + rel_block.replace(
              'signingConfig signingConfigs.debug',
              'signingConfig signingConfigs.release', 1)
          s = s[:m.start(2)] + new_block + s[m.end(2):]
          with open(path, 'w') as f:
              f.write(s)
          print('signingConfigs.release cableado SOLO en buildTypes.release')
          PY

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Limpiar keystore del runner
        if: always()
        working-directory: app/android
        run: rm -f release.keystore

      - name: Stage artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk productivity-app.apk
          ls -lh productivity-app.apk

      - name: Upload run artifact (retention 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: productivity-app-apk
          path: app/productivity-app.apk
          retention-days: 30

      # Publicar SOLO si el job llega aquí (gate validate fue verde).
      - name: Verify APK signature (rechaza clave debug)
        working-directory: app
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" -path '*/build-tools/*/apksigner' -type f 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::No se encontro apksigner en el SDK de Android"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs productivity-app.apk | tee /tmp/opencode-apksigner.txt
          if grep -qi 'Android Debug' /tmp/opencode-apksigner.txt; then
            echo "::error::La APK esta firmada con la clave debug publica de AOSP; no se publica."
            exit 1
          fi
          if ! grep -qi 'Signer #1' /tmp/opencode-apksigner.txt; then
            echo "::error::La APK no tiene firma verificable"
            exit 1
          fi

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK · última compilación
          body: |
            APK generado automáticamente desde `${{ github.sha }}`.

            ✅ Este APK pasó el gate de validación completo:
            - Backend: typecheck + tests + lint (baseline) + build
            - App: typecheck

            Instalación: descarga el archivo, permite orígenes desconocidos e instala.

            Esta APK está firmada con la keystore del proyecto (secret
            RELEASE_KEYSTORE_BASE64). Los EXPO_PUBLIC_SUPABASE_URL,
            EXPO_PUBLIC_SUPABASE_ANON_KEY y EXPO_PUBLIC_API_URL existen en
            el entorno de compilación (secrets). Sin ellos la app abrirá
            igualmente y mostrará la pantalla "Configuración incompleta".
          files: app/productivity-app.apk
          make_latest: true
