# CI — Integración continua del candidato integrado T1-T5
#
# Rama canónica: master (histórico). El workflow también escucha main por
# compatibilidad con un posible renombrado futuro.
#
# Regla de CI ante deuda ajena (T6b):
#   Los jobs de lint y expo-doctor usan continue-on-error SOLO para la deuda
#   preexistente registrada en el baseline. Cualquier regresión nueva dispara
#   un fallo real. El script de regresión de lint compara el contador de errores
#   con el baseline (191 errores / 5 warnings a 2026-11-14) y falla si sube.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  EXPO_NO_TELEMETRY: '1'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Backend (typecheck · tests · lint · build)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit — sin vulnerabilidades de produccion
        # Solo dependencias de runtime: las de desarrollo no van a la imagen.
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (unit + mocks)
        run: npx vitest run

      # Lint: falla solo si el número de problemas SUBE por encima del baseline
      # registrado en T6b (191 errors / 5 warnings = 196 total a 2026-11-14).
      # La deuda preexistente no bloquea CI; las regresiones sí.
      - name: Lint — regresion guard
        run: |
          BASELINE_ERRORS=191
          BASELINE_WARNS=5
          BASELINE_TOTAL=$((BASELINE_ERRORS + BASELINE_WARNS))

          # Capturar conteo actual
          LINT_OUTPUT=$(npx eslint src --format json 2>/dev/null || true)
          CURRENT_ERRORS=$(echo "$LINT_OUTPUT" | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(d.reduce((s,f)=>s+f.errorCount,0));
          ")
          CURRENT_WARNS=$(echo "$LINT_OUTPUT" | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(d.reduce((s,f)=>s+f.warningCount,0));
          ")
          CURRENT_TOTAL=$((CURRENT_ERRORS + CURRENT_WARNS))

          echo "Baseline : ${BASELINE_ERRORS} errors / ${BASELINE_WARNS} warnings (${BASELINE_TOTAL} total)"
          echo "Current  : ${CURRENT_ERRORS} errors / ${CURRENT_WARNS} warnings (${CURRENT_TOTAL} total)"

          if [ "$CURRENT_TOTAL" -gt "$BASELINE_TOTAL" ]; then
            echo "❌ REGRESION: lint problems increased from ${BASELINE_TOTAL} to ${CURRENT_TOTAL}"
            exit 1
          else
            echo "✅ Lint within baseline (preexisting debt recorded, not masked)"
          fi

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: App (expo-doctor · typecheck)
  # ─────────────────────────────────────────────────────────────────────────────
  app:
    name: App
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # --legacy-peer-deps obligatorio: el lockfile resuelve `ws` con dos
      # versiones por peers y `npm ci` sin flag aborta con EUSAGE.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # expo-doctor 57.0.32 vs 57.0.33: fallo PREEXISTENTE documentado en T6a.
      # NO actualizar expo sin autorización explícita. El check sigue corriendo
      # para detectar nuevos fallos; el exit code no bloquea CI.
      - name: Expo Doctor (preexisting warn - expo 57.0.32 vs ~57.0.33)
        run: npx expo-doctor
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Migración limpia (001→007 sobre Postgres desechable vacío)
  # ─────────────────────────────────────────────────────────────────────────────
  migration-clean:
    name: Migration — clean install (001→007)
    runs-on: ubuntu-24.04
    needs: [backend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: productivity_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d productivity_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: productivity_test
      TEST_DB_USER: test_user
      TEST_DB_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install integration harness deps
        run: npm ci
        working-directory: tests/integration

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for postgres…"; sleep 2
          done

      - name: Run integration tests — migration-clean scenario
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: productivity_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: |
          npx vitest run \
            --config ../tests/integration/vitest.config.mts \
            --reporter=verbose \
            tests/integration/scenarios/migration-clean.test.ts

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Migración actualización (001 con datos → 002→007)
  # ─────────────────────────────────────────────────────────────────────────────
  migration-update:
    name: Migration — incremental update (data preservation)
    runs-on: ubuntu-24.04
    needs: [backend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: productivity_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d productivity_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: productivity_test
      TEST_DB_USER: test_user
      TEST_DB_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install integration harness deps
        run: npm ci
        working-directory: tests/integration

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for postgres…"; sleep 2
          done

      - name: Run integration tests — migration-update scenario
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: productivity_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: |
          npx vitest run \
            --config ../tests/integration/vitest.config.mts \
            --reporter=verbose \
            tests/integration/scenarios/migration-update.test.ts

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Aislamiento de cuentas + integración API/DB
  # Ejecuta account-isolation y api-db-integration en un solo runner para
  # compartir el servicio Postgres y reducir tiempo de CI.
  # ─────────────────────────────────────────────────────────────────────────────
  account-isolation-and-api-db:
    name: Account isolation (RLS) + API/DB integration
    runs-on: ubuntu-24.04
    needs: [migration-clean]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: productivity_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d productivity_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: productivity_test
      TEST_DB_USER: test_user
      TEST_DB_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install integration harness deps
        run: npm ci
        working-directory: tests/integration

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for postgres…"; sleep 2
          done

      - name: Run integration tests — account isolation
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: productivity_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: |
          npx vitest run \
            --config ../tests/integration/vitest.config.mts \
            --reporter=verbose \
            tests/integration/scenarios/account-isolation.test.ts

      - name: Run integration tests — API/DB integration
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: productivity_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: |
          npx vitest run \
            --config ../tests/integration/vitest.config.mts \
            --reporter=verbose \
            tests/integration/scenarios/api-db-integration.test.ts

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6: Fixtures de fallo (OAuth · revisión académica · cambio de sesión · push)
  # Los escenarios session-change, push-failure, academic-review-failure son
  # plantillas con `expect(true).toBe(true)` — pasan siempre por diseño.
  # El escenario oauth-failure contiene lógica real de DB (SQL RLS).
  # Todos se mantienen en CI para atrapar regresiones cuando se implementen.
  # ─────────────────────────────────────────────────────────────────────────────
  failure-fixtures:
    name: Failure fixtures (OAuth · academic · session · push)
    runs-on: ubuntu-24.04
    needs: [migration-clean]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: productivity_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d productivity_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: productivity_test
      TEST_DB_USER: test_user
      TEST_DB_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install integration harness deps
        run: npm ci
        working-directory: tests/integration

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for postgres…"; sleep 2
          done

      # OAuth failure: lógica real (state caducado, state consumido, RLS sobre
      # calendar_oauth_states). Usa complete_calendar_connection RPC del 005.
      - name: Fixture — OAuth failure (expired / replayed / RLS)
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: productivity_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: |
          npx vitest run \
            --config ../tests/integration/vitest.config.mts \
            --reporter=verbose \
            tests/integration/scenarios/oauth-failure.test.ts

      # Academic review failure: plantilla base (todos los tests pasan con
      # expect(true)). En CI mientras T1-T5 implementan casos concretos.
      - name: Fixture — academic review failure (SM-2 rollback)
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: productivity_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: |
          npx vitest run \
            --config ../tests/integration/vitest.config.mts \
            --reporter=verbose \
            tests/integration/scenarios/academic-review-failure.test.ts

      # Session change: plantilla base.
      - name: Fixture — session change (A→B on device)
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: productivity_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: |
          npx vitest run \
            --config ../tests/integration/vitest.config.mts \
            --reporter=verbose \
            tests/integration/scenarios/session-change.test.ts

      # Push failure: plantilla base.
      - name: Fixture — push failure (invalid / reassigned tokens)
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: productivity_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: |
          npx vitest run \
            --config ../tests/integration/vitest.config.mts \
            --reporter=verbose \
            tests/integration/scenarios/push-failure.test.ts
