name: CI

# La rama por defecto del repositorio es `master`. Antes este workflow solo
# escuchaba a `main`, que no existe, asi que no se ejecutaba nunca.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

  app:
    name: App
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # --legacy-peer-deps es obligatorio: el lockfile resuelve `ws` con dos
      # versiones por peers y `npm ci` a secas aborta con EUSAGE.
      - run: npm ci --legacy-peer-deps

      # Detecta dependencias nativas no declaradas (fue la causa del APK que se
      # cerraba solo: @expo/vector-icons sin expo-font directo).
      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npx tsc --noEmit
